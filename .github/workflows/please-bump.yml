name: please-bump

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    branches: [main]

# Two quick pushes would otherwise race to create the sticky comment
concurrency:
  group: please-bump-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  # Fork PRs get a read-only token: the comment is skipped, the check still runs
  pull-requests: write

jobs:
  please-bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gvegayon/please-bump@v1
